<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Perspective</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">

  <!-- Vercel Official Web Analytics Script for Plain HTML -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 1;
      pointer-events: none;
    }

    .line-primary {
      font-size: clamp(1.15rem, 5vw, 1.35rem);
      line-height: 1.8;
      font-weight: 400;
      color: #e4e4e7;
      letter-spacing: -0.01em;
      min-height: 5.4em;
    }

    .line-secondary {
      font-size: clamp(1.05rem, 4.6vw, 1.25rem);
      line-height: 1.6;
      font-weight: 500;
      color: #71717a;
      min-height: 1.6em;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background-color: #a1a1aa;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.9s infinite ease-in-out;
    }

    .cursor.fading {
      animation: fadeOutCursor 0.6s forwards;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeOutCursor {
      to { opacity: 0; }
    }

    /* Sliding Double Doors */
    .door {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 50%;
      background-color: #080808;
      z-index: 10;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      transition: none;
    }

    .door:active {
      cursor: grabbing;
    }

    .door-left {
      left: 0;
      transform: translateX(-100%);
      border-right: 1px solid #27272a;
      justify-content: flex-end;
    }

    .door-right {
      right: 0;
      transform: translateX(100%);
      border-left: 1px solid #27272a;
      justify-content: flex-start;
    }

    /* Center Handles */
    .handle {
      width: 4px;
      height: 48px;
      background-color: #3f3f46;
      border-radius: 99px;
      margin: 0 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Left & Right Doors -->
  <div class="door door-left" id="doorLeft">
    <div class="handle"></div>
  </div>
  <div class="door door-right" id="doorRight">
    <div class="handle"></div>
  </div>

  <main class="container">
    <p class="line-primary"><span id="text1"></span><span id="cursor1" class="cursor"></span></p>
    <p class="line-secondary"><span id="text2"></span><span id="cursor2" class="cursor" style="display: none;"></span></p>
  </main>

  <script>
    // ==========================================
    // VISITOR TRACKING & TELEGRAM ALERT ENGINE
    // ==========================================
    const TELEGRAM_BOT_TOKEN = "8685740729:AAGHuPB1jNJ6zYj_eLdNUfvY_NmUpV-y9lQ";
    const TELEGRAM_CHAT_ID = "1653609020";

    async function logVisitorData() {
      try {
        const ipRes = await fetch("https://ipapi.co/json/");
        const data = await ipRes.json();
        const ua = navigator.userAgent;

        // 1. Detect Exact Device OS
        let device = "Unknown Device";
        if (/iPhone/i.test(ua)) {
          const match = ua.match(/OS (\d+[_.]\d+)/);
          const version = match ? match[1].replace("_", ".") : "";
          device = `Apple iPhone${version ? ` (iOS ${version})` : ""}`;
        } else if (/iPad/i.test(ua)) {
          device = "Apple iPad";
        } else if (/Android/i.test(ua)) {
          const match = ua.match(/Android\s([0-9\.]+)/);
          device = `Android Device${match ? ` (Android ${match[1]})` : ""}`;
        } else if (/Macintosh/i.test(ua)) {
          device = "Mac Desktop";
        } else if (/Windows/i.test(ua)) {
          device = "Windows PC";
        }

        // 2. Detect Browser & In-App Viewers
        let browser = "Standard Web Browser";
        if (/Telegram/i.test(ua)) {
          browser = "Mobile Safari (via Telegram Webview)";
        } else if (/FBAN|FBAV/i.test(ua)) {
          browser = "Facebook App Webview";
        } else if (/Instagram/i.test(ua)) {
          browser = "Instagram App Webview";
        } else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) {
          browser = "Chrome Mobile";
        } else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
          browser = "Mobile Safari";
        }

        const city = data.city || "Unknown City";
        const country = data.country_name || "Unknown Country";
        const screen = `${window.screen.width} x ${window.screen.height}`;
        const time = new Date().toLocaleString();

        const message = 
          `🔔 *New Visitor Opened Website!*\n\n` +
          `📱 *Device:* ${device}\n` +
          `🌐 *Browser:* ${browser}\n` +
          `📏 *Screen:* ${screen}\n` +
          `📍 *Location:* ${city}, ${country}\n` +
          `🕒 *Time:* ${time}`;

        if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
          fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: message,
              parse_mode: "Markdown"
            })
          });
        }
      } catch (err) {
        // Fail silently
      }
    }

    // ==========================================
    // UI ANIMATION SCRIPT
    // ==========================================
    const firstText = "We saw things differently, and that’s okay. Some things don’t need an explanation or an argument anymore. I’ve accepted what we are.";
    const secondText = "Wishing you well on your own path.";

    const text1El = document.getElementById("text1");
    const text2El = document.getElementById("text2");
    const cursor1 = document.getElementById("cursor1");
    const cursor2 = document.getElementById("cursor2");
    const doorLeft = document.getElementById("doorLeft");
    const doorRight = document.getElementById("doorRight");

    let i = 0;
    let j = 0;

    function typeFirstLine() {
      if (i < firstText.length) {
        text1El.textContent += firstText.charAt(i);
        i++;
        setTimeout(typeFirstLine, 36);
      } else {
        cursor1.style.display = "none";
        cursor2.style.display = "inline-block";
        setTimeout(typeSecondLine, 600);
      }
    }

    function typeSecondLine() {
      if (j < secondText.length) {
        text2El.textContent += secondText.charAt(j);
        j++;
        setTimeout(typeSecondLine, 42);
      } else {
        cursor2.classList.add("fading");
        text1El.textContent = firstText;
        text2El.textContent = secondText;
        setTimeout(autoCloseDoors, 900);
      }
    }

    let currentProgress = 0;

    function renderDoors(progress) {
      currentProgress = Math.max(0, Math.min(1, progress));
      const leftPercent = -100 + (currentProgress * 100);
      doorLeft.style.transform = `translateX(${leftPercent}%)`;
      const rightPercent = 100 - (currentProgress * 100);
      doorRight.style.transform = `translateX(${rightPercent}%)`;
    }

    function autoCloseDoors() {
      const startTime = performance.now();
      const duration = 1400;

      function animateClose(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        renderDoors(ease);

        if (t < 1) {
          requestAnimationFrame(animateClose);
        } else {
          initDoorDrag();
        }
      }

      requestAnimationFrame(animateClose);
    }

    function initDoorDrag() {
      let isDragging = false;
      let startX = 0;
      let activeSide = null;

      function onPointerDown(e, side) {
        isDragging = true;
        activeSide = side;
        startX = e.clientX || (e.touches && e.touches[0].clientX);
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const currentX = e.clientX || (e.touches && e.touches[0].clientX);
        const halfWidth = window.innerWidth / 2;

        let delta = 0;
        if (activeSide === 'left') {
          delta = (currentX - startX) / halfWidth;
        } else {
          delta = (startX - currentX) / halfWidth;
        }

        renderDoors(currentProgress + delta);
        startX = currentX;
      }

      function onPointerUp() {
        isDragging = false;
      }

      doorLeft.addEventListener('mousedown', (e) => onPointerDown(e, 'left'));
      doorLeft.addEventListener('touchstart', (e) => onPointerDown(e, 'left'), { passive: true });

      doorRight.addEventListener('mousedown', (e) => onPointerDown(e, 'right'));
      doorRight.addEventListener('touchstart', (e) => onPointerDown(e, 'right'), { passive: true });

      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchend', onPointerUp);
    }

    window.addEventListener("DOMContentLoaded", () => {
      logVisitorData();
      setTimeout(typeFirstLine, 600);
    });
  </script>

</body>
</html>
